# Render "Blueprint": tells Render how to build and run the app.
# Secrets are NOT in this file. `sync: false` means Render asks for the
# value in its dashboard and stores it there.
services:
  - type: web
    name: crossover
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: QLOO_API_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: REPO_URL
        sync: false
